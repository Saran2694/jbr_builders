<!doctype html>
<html lang="en" class="scroll-smooth">  
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/jbr-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JBR Builders | Building Your Vision. Creating Your Future.</title>
    <meta name="description" content="JBR Builders - Quality construction, thoughtful planning, and reliable building solutions tailored to your needs. Offices in Tuticorin and Tirunelveli, Tamil Nadu." />
    <meta name="keywords" content="JBR Builders, construction company Tuticorin, builders Tirunelveli, residential construction, turnkey construction, commercial builders Tamil Nadu" />
    <meta name="author" content="JBR Builders" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-[#202A35] antialiased selection:bg-[#2468A6] selection:text-white">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        if (!document.getElementById('root').hasChildNodes()) {
          var box = document.getElementById('debug-error-box');
          if (!box) {
            box = document.createElement('div');
            box.id = 'debug-error-box';
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#ffffff;color:#b91c1c;padding:30px;z-index:999999;font-family:monospace;font-size:14px;overflow:auto;';
            document.body.appendChild(box);
          }
          box.innerHTML += '<h3 style="color:#b91c1c;">Startup Error:</h3><pre style="background:#f1f5f9;padding:12px;border-radius:6px;color:#1e293b;">' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre><button onclick="location.reload()" style="margin-top:10px;padding:8px 16px;background:#123b68;color:#fff;border:none;border-radius:6px;cursor:pointer;">Reload</button>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
